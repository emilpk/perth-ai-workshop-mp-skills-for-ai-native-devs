<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skills Night Live</title>
<meta name="description" content="Vote, answer quick checks and ask questions at Perth AI's Skills Night.">
<meta name="theme-color" content="#0b132b">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<link rel="icon" type="image/png" sizes="32x32" href="../brand/favicon-32.png">
<link rel="apple-touch-icon" href="../brand/apple-touch-icon.png">
<link rel="stylesheet" href="../style.css">
<script src="deck.js"></script>
<script src="live.js"></script>
<script src="pixel.js"></script>
<style>
/* The phone view: follows the projector, shows the current poll or quick check, and holds the questions */
body { min-height: 100dvh; overflow-x: hidden; }
.bar .wrap { flex-wrap: nowrap; }
.status { margin-left: auto; display: inline-flex; align-items: center; gap: .4em; font: 500 .8rem var(--mono); color: var(--band-muted); white-space: nowrap; }
.status::before { content: ""; width: .55em; height: .55em; border-radius: 50%; background: #ffffff40; }
.status.live::before { background: #3ddc97; }
.status.reconnecting::before, .status.connecting::before { background: var(--cta); }
.tabs { display: flex; gap: .25rem; padding-block: .5rem; position: sticky; top: 0; background: var(--paper); z-index: 2; border-bottom: 1px solid var(--line); }
.tabs button { flex: 1; font: 600 .95rem var(--display); padding: .6rem .5rem; border-radius: 999px; border: 0; background: none; color: var(--muted); cursor: pointer; }
.tabs button[aria-selected="true"] { background: var(--band); color: var(--band-ink); }
.tabs .badge { display: inline-block; min-width: 1.5em; margin-left: .3em; padding: 0 .4em; border-radius: 999px; background: var(--cta); color: var(--cta-ink); font: 600 .75rem/1.5 var(--mono); }
main { padding-block: 1.25rem 3rem; display: grid; gap: 1.25rem; }
.now { display: grid; gap: .6rem; }
.now h1 { font-size: clamp(1.5rem, 6.5vw, 2rem); }
.now h1 em { font-style: normal; color: var(--river); }
.now .sub { color: var(--muted); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 1rem; display: grid; gap: .75rem; }
.card h2 { font-size: 1.15rem; }
.opts { display: grid; gap: .5rem; }
.opt { position: relative; display: flex; justify-content: space-between; gap: .75rem; align-items: center; width: 100%; text-align: left; font: 500 1rem var(--body); color: var(--ink); background: var(--paper); border: 2px solid var(--line); border-radius: 12px; padding: .8rem 1rem; cursor: pointer; overflow: hidden; min-height: 3rem; }
.opt > * { position: relative; }
.opt .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: var(--river-soft); transition: width .5s ease; }
.opt .n { font: 500 .85rem var(--mono); color: var(--muted); }
.opt[aria-pressed="true"] { border-color: var(--cta); }
.opt[aria-pressed="true"]::after { content: "✓"; position: relative; font-weight: 700; color: var(--sun); }
.opt.right { border-color: #2fb27a; }
.opt.wrong[aria-pressed="true"] { border-color: var(--alarm); }
.hint { font-size: .85rem; color: var(--muted); }
.explain pre { margin: .5rem 0 0; font: 400 .8rem/1.5 var(--mono); white-space: pre-wrap; }
.explain { background: var(--sun-soft); border-left: 4px solid var(--cta); padding: .6rem .8rem; border-radius: 0 10px 10px 0; }
.prompt-box { position: relative; }
.prompt-box pre { margin: 0; background: var(--code-bg); color: var(--code-fg); border-radius: 12px; padding: .9rem 1rem; font: 400 .85rem/1.55 var(--mono); white-space: pre-wrap; word-break: break-word; }
.prompt-box pre b { color: var(--code-label); font-weight: 500; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: .4em; font: 600 .95rem var(--display); padding: .65rem 1.1rem; border-radius: 999px; border: 0; background: var(--cta); color: var(--cta-ink); cursor: pointer; text-decoration: none; }
.btn.ghost { background: none; color: var(--ink); box-shadow: inset 0 0 0 1.5px var(--line); }
.btn:disabled { opacity: .5; cursor: default; }
.links { display: flex; flex-wrap: wrap; gap: .5rem; }
textarea, input[type=text] { width: 100%; font: 400 1rem var(--body); color: var(--ink); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: .7rem .8rem; }
textarea { min-height: 5.5rem; resize: vertical; }
.ask-row { display: flex; gap: .5rem; align-items: center; justify-content: space-between; flex-wrap: wrap; }
.ask-row input { flex: 1; min-width: 10rem; }
.qs { display: grid; gap: .5rem; }
.qitem { display: grid; grid-template-columns: auto 1fr; gap: .75rem; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: .7rem .8rem; }
.qitem.done { opacity: .55; }
.qitem small { display: block; color: var(--muted); font-size: .8rem; margin-top: .15rem; }
.up { display: grid; justify-items: center; min-width: 3rem; font: 600 .85rem var(--mono); color: var(--muted); background: var(--paper); border: 1.5px solid var(--line); border-radius: 10px; padding: .3rem .4rem; cursor: pointer; }
.up[aria-pressed="true"] { border-color: var(--cta); color: var(--sun); }
.up:disabled { cursor: default; }
.empty { color: var(--muted); }
.offline { background: var(--sun-soft); border-radius: 12px; padding: .8rem 1rem; }
.toast { position: fixed; left: 50%; bottom: max(1rem, env(safe-area-inset-bottom)); transform: translateX(-50%); background: var(--band); color: var(--band-ink); padding: .55rem 1rem; border-radius: 999px; font-size: .9rem; z-index: 9; }
.runner { position: fixed; bottom: max(8px, env(safe-area-inset-bottom)); left: 0; height: 40px; image-rendering: pixelated; z-index: 8; pointer-events: none; }
</style>
</head>
<body>
<header class="bar">
  <div class="wrap">
    <a class="logo" href="../" id="logo"><img src="../brand/perth-ai-mark.webp" alt="" width="256" height="256"><span class="word">PERTH <span>AI</span></span><span class="event">Skills Night</span></a>
    <span class="status" id="status">connecting</span>
  </div>
</header>

<div class="wrap">
  <div class="tabs" role="tablist">
    <button type="button" role="tab" id="tab-now" aria-selected="true" aria-controls="now">Now</button>
    <button type="button" role="tab" id="tab-qs" aria-selected="false" aria-controls="questions">Questions<span class="badge" id="qcount" hidden></span></button>
  </div>
</div>

<main class="wrap" id="now" role="tabpanel" aria-labelledby="tab-now">
  <p class="offline" id="offline" hidden>Can’t reach the live room right now. Follow along on the big screen; this page will catch up when it’s back.</p>
  <section class="now" id="current" aria-live="polite"></section>
  <section class="card" id="poll" hidden></section>
  <section class="prompt-box" id="prompt" hidden></section>
  <nav class="links" aria-label="Workshop pages">
    <a class="btn ghost" id="link-setup">Setup guide</a>
    <a class="btn ghost" id="link-skills">Skills cheat sheet</a>
  </nav>
</main>

<main class="wrap" id="questions" role="tabpanel" aria-labelledby="tab-qs" hidden>
  <form class="card" id="ask">
    <h2>Ask a question</h2>
    <textarea id="ask-text" maxlength="280" placeholder="What do you want to know?" required></textarea>
    <div class="ask-row">
      <input type="text" id="ask-name" maxlength="40" placeholder="Your name (optional)" autocomplete="given-name">
      <button class="btn" type="submit" id="ask-send">Ask</button>
    </div>
    <p class="hint">Vote up the questions you want answered. The top ones go on screen at Q&amp;A.</p>
  </form>
  <section class="qs" id="qs"></section>
</main>

<script>
(function () {
  var slides = DECK.slides, links = DECK.links();
  var $ = function (id) { return document.getElementById(id); };
  var state = null, mine = { votes: {}, answers: {}, upped: [], asked: [] }, live = false, shownSlide = -1;
  function esc(t) { return String(t).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }

  $('link-setup').href = links.setup;
  $('link-skills').href = links.skills;

  function toast(text) {
    var t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
    document.body.appendChild(t); setTimeout(function () { t.remove(); }, 1800);
  }

  // Tabs
  function tab(which) {
    $('tab-now').setAttribute('aria-selected', String(which === 'now'));
    $('tab-qs').setAttribute('aria-selected', String(which === 'qs'));
    $('now').hidden = which !== 'now';
    $('questions').hidden = which !== 'qs';
  }
  $('tab-now').onclick = function () { tab('now'); };
  $('tab-qs').onclick = function () { tab('qs'); };

  function renderNow() {
    var i = state ? state.slide : 0, s = slides[i];
    var key = i + '|' + live;
    if (key !== shownSlide) {
      shownSlide = key;
      $('current').innerHTML = '<p class="eyebrow">' + esc(s.part) + ' · ' + s.kicker + '</p>' + ((s.poll || s.write) && live ? '' : '<h1>' + s.say + '</h1>' + (s.sub ? '<p class="sub">' + s.sub + '</p>' : ''));
      if (s.prompt) {
        $('prompt').hidden = false;
        $('prompt').innerHTML = '<pre>' + s.prompt + '</pre><p style="margin-top:.5rem"><button class="btn ghost" type="button" id="copy">Copy</button></p>';
        $('copy').onclick = function () {
          var text = $('prompt').querySelector('pre').textContent;
          (navigator.clipboard ? navigator.clipboard.writeText(text) : Promise.reject()).then(function () { toast('Copied'); }, function () { toast('Press and hold to copy'); });
        };
      } else $('prompt').hidden = true;
      if (s.link === 'issues') $('current').insertAdjacentHTML('beforeend', '<p><a class="btn ghost" href="' + links.issues + '">Open the bug reports</a></p>');
      if (s.qa) $('current').insertAdjacentHTML('beforeend', '<p><button class="btn" type="button" id="goto-qs">Ask or vote</button></p>');
      if (s.qa) $('goto-qs').onclick = function () { tab('qs'); };
      if (s.button) $('current').insertAdjacentHTML('beforeend', '<p><a class="btn" href="' + links[s.button[0]] + '" target="_blank" rel="noopener">' + esc(s.button[1]) + '</a></p>');
      if (s.egg) $('current').insertAdjacentHTML('beforeend', '<p><a class="btn ghost" href="https://perthai.org/quokka-run">Play Quokka Run while you eat</a></p>');
    }
    renderPoll(s);
  }

  // A short written answer: one per person, editable until the slide moves on
  function renderWrite(s) {
    var box = $('poll'), mineText = mine.answers[s.name] || '';
    var w = (state.walls && state.walls[s.name]) || { count: 0 };
    var hint = (mineText ? 'Sent. Edit and send again to change it. ' : 'Answers go on screen without your name. ') + w.count + (w.count === 1 ? ' answer' : ' answers') + ' so far.';
    if (box.dataset.write === s.name) { box.querySelector('.hint').textContent = hint; box.querySelector('.btn').textContent = mineText ? 'Update' : 'Send'; return; }
    box.dataset.write = s.name;
    box.innerHTML = '<h2>' + esc(s.write.q) + '</h2><textarea maxlength="200" placeholder="' + esc(s.write.placeholder || '') + '"></textarea>' +
      '<div class="ask-row"><span class="hint"></span><button class="btn" type="button"></button></div>';
    var ta = box.querySelector('textarea'); ta.value = mineText;
    box.querySelector('.hint').textContent = hint; box.querySelector('.btn').textContent = mineText ? 'Update' : 'Send';
    box.querySelector('.btn').onclick = function () {
      var text = ta.value.trim();
      if (!text) return;
      if (conn.send({ type: 'answer', poll: s.name, text: text })) { mine.answers[s.name] = text; toast('Sent'); renderWrite(s); }
      else toast('Not connected, try again in a moment');
    };
  }

  function renderPoll(s) {
    var box = $('poll');
    if (!(s.poll || s.write) || !live || !state) { box.hidden = true; box.innerHTML = ''; box.dataset.write = ''; return; }
    if (s.write) { box.hidden = false; renderWrite(s); return; }
    box.dataset.write = '';
    box.hidden = false;
    var p = s.poll, my = mine.votes[s.name] || [], quiz = p.answer !== undefined;
    var revealed = Boolean(state.reveal[s.name]);
    var t = state.tallies[s.name] || { counts: [], voters: 0 };
    var showCounts = my.length > 0 && (!quiz || revealed);
    var html = '<h2>' + esc(p.q) + '</h2>' + (p.multi ? '<p class="hint">Tick all that apply.</p>' : '') + '<div class="opts">' +
      p.options.map(function (o, n) {
        var on = my.indexOf(n) >= 0, cls = quiz && revealed ? (n === p.answer ? ' right' : ' wrong') : '';
        var count = t.counts[n] || 0, pct = Math.round(100 * count / Math.max(t.voters, 1));
        return '<button type="button" class="opt' + cls + '" data-n="' + n + '" aria-pressed="' + on + '"' + (quiz && revealed ? ' disabled' : '') + '>' +
          '<span class="fill" style="width:' + (showCounts ? pct : 0) + '%"></span><span>' + esc(o) + '</span>' + (showCounts ? '<span class="n">' + count + '</span>' : '') + '</button>';
      }).join('') + '</div>';
    if (quiz && revealed) {
      var got = my.length ? (my[0] === p.answer ? 'You got it.' : 'Not this time.') : '';
      html += '<div class="explain"><p>' + (got ? '<b>' + got + '</b> ' : '') + p.explain + '</p>' + (p.code ? '<pre>' + esc(p.code) + '</pre>' : '') + '</div>';
    } else html += '<p class="hint">' + (my.length ? 'Voted. You can change it until we move on.' : (quiz ? 'Answer, then watch the screen.' : 'Tap to vote.')) + ' ' + t.voters + ' so far.</p>';
    box.innerHTML = html;
    box.querySelectorAll('.opt').forEach(function (b) {
      b.onclick = function () {
        var n = Number(b.dataset.n), next;
        if (p.multi) next = my.indexOf(n) >= 0 ? my.filter(function (x) { return x !== n; }) : my.concat(n);
        else next = my[0] === n ? [] : [n];
        mine.votes[s.name] = next; renderPoll(s);
        if (!conn.send({ type: 'vote', poll: s.name, choices: next })) toast('Not connected, try again in a moment');
        if (navigator.vibrate) navigator.vibrate(12);
      };
    });
  }

  function renderQuestions() {
    var qs = state ? state.questions.slice() : [];
    var open = qs.filter(function (q) { return !q.done; }).length;
    $('qcount').hidden = !open; $('qcount').textContent = open;
    qs.sort(function (a, b) { return (a.done - b.done) || (b.ups - a.ups) || (b.ts - a.ts); });
    $('qs').innerHTML = qs.length ? qs.map(function (q) {
      var mineQ = mine.asked.indexOf(q.id) >= 0, up = mine.upped.indexOf(q.id) >= 0;
      return '<div class="qitem' + (q.done ? ' done' : '') + '"><button type="button" class="up" data-q="' + q.id + '" aria-pressed="' + up + '"' + (mineQ ? ' disabled title="Your question"' : '') + ' aria-label="Vote up">▲<span>' + q.ups + '</span></button>' +
        '<div>' + esc(q.text) + '<small>' + (q.name ? esc(q.name) : 'Anonymous') + (mineQ ? ' · yours' : '') + (q.done ? ' · answered' : '') + '</small></div></div>';
    }).join('') : '<p class="empty">No questions yet. Be the first.</p>';
    $('qs').querySelectorAll('.up').forEach(function (b) {
      b.onclick = function () { conn.send({ type: 'upvote', q: b.dataset.q }); };
    });
  }

  $('ask-name').value = store('sn-name') || '';
  $('ask').onsubmit = function (e) {
    e.preventDefault();
    var text = $('ask-text').value.trim();
    if (!text) return;
    store('sn-name', $('ask-name').value.trim());
    if (conn.send({ type: 'ask', text: text, name: $('ask-name').value.trim() })) { $('ask-text').value = ''; toast('Asked. Thanks!'); }
    else toast('Not connected, try again in a moment');
  };

  // Easter egg: tap the quokka five times and one runs across the bottom of your phone
  var taps = 0, tapTimer = null;
  $('logo').addEventListener('click', function (e) {
    e.preventDefault();
    taps++; clearTimeout(tapTimer);
    tapTimer = setTimeout(function () { if (taps < 5) location.href = links.setup; taps = 0; }, 600);
    if (taps >= 5) { taps = 0; clearTimeout(tapTimer); runQuokka(); }
  });
  function runQuokka() {
    var art = Pixel(), q = document.createElement('img'), start = null, frame = 0, w = innerWidth;
    q.className = 'runner'; q.alt = ''; q.src = art.run1; document.body.appendChild(q);
    function step(ts) {
      if (start === null) start = ts;
      var p = (ts - start) / 3500, x = -60 + p * (w + 120);
      if (++frame % 8 === 0) q.src = q.src === art.run1 ? art.run2 : art.run1;
      q.style.transform = 'translateX(' + x + 'px)';
      if (p < 1) requestAnimationFrame(step); else q.remove();
    }
    requestAnimationFrame(step);
  }

  var labels = { live: 'live', connecting: 'connecting', reconnecting: 'reconnecting', offline: 'offline', 'badkey-or-offline': 'offline' };
  var conn = Live({
    role: 'phone',
    onStatus: function (st) {
      live = st === 'live';
      $('status').className = 'status ' + st; $('status').textContent = labels[st] || st;
      $('offline').hidden = st !== 'offline' && st !== 'reconnecting';
      $('ask-send').disabled = !live;
      renderNow();
    },
    onState: function (st) {
      var moved = !state || st.slide !== state.slide;
      state = st; live = true;
      $('status').className = 'status live'; $('status').textContent = 'live';
      $('offline').hidden = true; $('ask-send').disabled = false;
      renderNow(); renderQuestions();
      if (moved && (slides[st.slide].poll || slides[st.slide].write) && navigator.vibrate) navigator.vibrate([20, 60, 20]);
    },
    onYou: function (m) { mine = { votes: m.votes || {}, answers: m.answers || {}, upped: m.upped || [], asked: m.asked || [] }; if (state) { renderPoll(slides[state.slide]); renderQuestions(); } }
  });
  renderNow(); renderQuestions();
})();
</script>
</body>
</html>
